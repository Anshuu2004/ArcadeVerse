<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Brick Breaker</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <div class="hud-item title">🚀 GALAXY BREAKER</div>
      <div class="hud-item">SCORE: <span id="score-val">0</span></div>
      <div class="hud-item">LIVES: <span id="lives-val">3</span> ❤️</div>
    </div>

    <div class="canvas-box">
      <canvas id="breakoutCanvas" width="480" height="400"></canvas>
      <div id="game-overlay" class="overlay">
        <div class="overlay-card">
          <h2 id="overlay-title">MISSION BRIEFING</h2>
          <p id="overlay-msg">Destroy cosmic energy shields. Move paddle with Mouse or Arrow Keys.</p>
          <button id="start-btn" class="glow-button">LAUNCH PADDLE</button>
        </div>
      </div>
    </div>

    <div class="controls-hint">
      Move: [◀ / ▶] or Mouse drag | Launch: [Spacebar]
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
